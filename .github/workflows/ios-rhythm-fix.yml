name: Build iOS (Signed IPA, Rhythm scroll fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply Rhythm scroll fixes
        run: |
          set -euo pipefail

          # 1) Rhythm keeps the standard header size (drops the 140 / 34 overrides).
          f=lib/theme/rhythm_theme.dart
          sed -i '/headerExpandedHeight: 140,/d;/headerExpandedTitleSize: 34,/d' "$f"
          if grep -qE 'headerExpandedHeight: 140|headerExpandedTitleSize: 34' "$f"; then
            echo "::error::Header patch did not apply to $f"; exit 1
          fi

          # 2) Rhythm uses the same bottom navigation bar as Material.
          f=lib/widgets/expressive_navigation_bar.dart
          sed -i 's/if (context.isRhythm || !materialExpressiveEnabled(context)) {/if (!materialExpressiveEnabled(context)) {/' "$f"
          if grep -q 'context.isRhythm || !materialExpressiveEnabled' "$f"; then
            echo "::error::Nav bar patch did not apply to $f"; exit 1
          fi
          grep -q 'if (!materialExpressiveEnabled(context)) {' "$f" || { echo "::error::Nav bar patch missing in $f"; exit 1; }

          git diff --stat

      - name: Fetch Discord SDK (iOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download discord-sdk --pattern discord-ios.zip --dir /tmp
          mkdir -p third_party/tango_discord/ios/Frameworks
          unzip -q /tmp/discord-ios.zip -d third_party/tango_discord/ios/Frameworks
          test -d third_party/tango_discord/ios/Frameworks/discord_partner_sdk.xcframework
          test -f third_party/tango_discord/ios/Frameworks/Discord-License-Notices.txt

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Cache Rust (cargo + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: rust-ios-${{ runner.os }}-${{ hashFiles('rust_backend/Cargo.lock', 'rust_backend/rust-toolchain.toml', 'scripts/build_rust_backend.sh') }}
          restore-keys: |
            rust-ios-${{ runner.os }}-

      - name: Build Rust backend for iOS
        run: bash scripts/build_ios.sh

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Pods
          key: pods-rust-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'rust_backend/TangoBackend.podspec', 'rust_backend/Cargo.lock') }}
          restore-keys: pods-rust-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_audio*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/build/ios/ipa/Tango-ios-unsigned.ipa" Payload

      - name: Re-sign IPA with provisioning profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done

          # Temporary keychain + certificate
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')"
          [ -n "$IDENTITY" ] || { echo "::error::No signing identity found in p12"; exit 1; }

          # Provisioning profile -> bundle id + entitlements
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          APPID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          BUNDLE_ID="${APPID#*.}"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          echo "Signing as bundle id: $BUNDLE_ID"

          # Unpack unsigned IPA
          WORK="$RUNNER_TEMP/resign"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q build/ios/ipa/Tango-ios-unsigned.ipa -d "$WORK"
          APP="$WORK/Payload/Runner.app"

          # The profile covers one app id only, so drop extensions (e.g. PlayerWidget)
          rm -rf "$APP/PlugIns"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # Sign nested frameworks/dylibs first, then the app
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              codesign --force --sign "$IDENTITY" --timestamp=none "$f"
            done
          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/build/ios/ipa/Tango-ios-signed.ipa" Payload)

      - name: Upload IPA to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RCLONE_CONFIG_GDRIVE_CLIENT_ID" ] && [ -n "$GDRIVE_REFRESH_TOKEN" ] || { echo "::error::Missing Google Drive secrets"; exit 1; }
          brew install rclone
          export RCLONE_CONFIG_GDRIVE_TOKEN="{\"access_token\":\"\",\"token_type\":\"Bearer\",\"refresh_token\":\"$GDRIVE_REFRESH_TOKEN\",\"expiry\":\"2000-01-01T00:00:00Z\"}"
          rclone copyto build/ios/ipa/Tango-ios-signed.ipa "gdrive:Tango-builds/Tango-rhythm-fix-${{ github.run_number }}.ipa" -v
