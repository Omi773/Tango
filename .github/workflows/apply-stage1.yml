name: Apply stage 1 (remove theme option)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: git apply --whitespace=nowarn stage1-remove-theme-option.patch

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Remove patch file
        run: rm stage1-remove-theme-option.patch

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: stage1-remove-theme-option
          title: "Remove theme option, Rhythm is the only theme"
          commit-message: "Remove theme option, Rhythm is the only theme"
