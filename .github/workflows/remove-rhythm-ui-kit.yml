name: Remove Rhythm UI kit (undo)

# Actions tab -> "Remove Rhythm UI kit (undo)" -> Run workflow.
# Deletes lib/widgets/rhythm/ and restores the 2 edited files. Safe to run again.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original files
        run: |
          cat > /tmp/revert.py <<'PY_EOF'
          import pathlib, sys

          ROOT = pathlib.Path("lib")
          failed = []

          def patch(rel, edits):
              p = ROOT / rel
              s = p.read_text(encoding="utf-8")
              for old, new, marker in edits:
                  if s.count(new) == 1:
                      s = s.replace(new, old)
                      print(f"reverted: {rel}")
                  elif s.count(old) == 1:
                      print(f"already original: {rel}")
                  else:
                      failed.append(f"{rel}: could not find text to revert: {new[:60]!r}")
              p.write_text(s, encoding="utf-8")

          # 1. Every modal sheet: Rhythm header (large title + subtitle pill)
          patch("widgets/app_bottom_sheet.dart", [
              ("""                  child: Text(
                              title!,
                              style: theme.textTheme.titleMedium?.copyWith(
                                fontWeight: FontWeight.w600,
                              ),
                            ),
          """,
               """                  child: Text(
                              title!,
                              style: context.isRhythm
                                  ? theme.textTheme.displayMedium?.copyWith(
                                      fontWeight: FontWeight.w500,
                                      color: theme.colorScheme.onSurface,
                                    )
                                  : theme.textTheme.titleMedium?.copyWith(
                                      fontWeight: FontWeight.w600,
                                    ),
                            ),
          """,
               "theme.textTheme.displayMedium"),
              ("""            child: Text(
                        subtitle!,
                        maxLines: 3,
                        overflow: TextOverflow.ellipsis,
                        style: theme.textTheme.bodyMedium?.copyWith(
                          color: theme.colorScheme.onSurfaceVariant,
                        ),
                      ),
          """,
               """            child: context.isRhythm
                          ? Align(
                              alignment: AlignmentDirectional.centerStart,
                              child: DecoratedBox(
                                decoration: BoxDecoration(
                                  color: theme.colorScheme.surfaceContainerHigh,
                                  borderRadius: BorderRadius.circular(100),
                                ),
                                child: Padding(
                                  padding: const EdgeInsets.symmetric(
                                    horizontal: 12,
                                    vertical: 6,
                                  ),
                                  child: Text(
                                    subtitle!,
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                    style: theme.textTheme.labelLarge?.copyWith(
                                      color: theme.colorScheme.onSurface,
                                    ),
                                  ),
                                ),
                              ),
                            )
                          : Text(
                              subtitle!,
                              maxLines: 3,
                              overflow: TextOverflow.ellipsis,
                              style: theme.textTheme.bodyMedium?.copyWith(
                                color: theme.colorScheme.onSurfaceVariant,
                              ),
                            ),
          """,
               "child: context.isRhythm\n                ? Align("),
          ])

          # 2. Now-playing marker in track rows: Rhythm's equalizer icon
          patch("widgets/track_card.dart", [
              ("import 'package:tango/widgets/now_playing_indicator.dart';\n",
               "import 'package:tango/widgets/now_playing_indicator.dart';\nimport 'package:tango/widgets/rhythm/rhythm_ui.dart';\n",
               "rhythm/rhythm_ui.dart"),
              ("                  NowPlayingIndicator(playing: isPlaying, color: contentColor),\n",
               "                  RhythmEqIcon(isPlaying: isPlaying, color: contentColor),\n",
               "RhythmEqIcon(isPlaying"),
          ])

          if failed:
              print("\nREMOVE FAILED:")
              for f in failed:
                  print(" -", f)
              sys.exit(1)
          print("\nRhythm UI kit removed.")
          PY_EOF
          python3 /tmp/revert.py
          rm -rf lib/widgets/rhythm

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Remove Rhythm UI kit"
          git push
