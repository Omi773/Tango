name: Re-sign IPA (no build)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag that has the unsigned .ipa attached"
        required: true
        default: "unsigned"

permissions:
  contents: write

jobs:
  resign:
    runs-on: macos-15

    steps:
      - name: Download unsigned IPA from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p in
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*unsigned*.ipa" \
            --dir in
          ls -la in
          mv in/*unsigned*.ipa unsigned.ipa

      - name: Re-sign IPA with p12 + mobileprovision
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done

          # Temporary keychain + certificate
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')"
          [ -n "$IDENTITY" ] || { echo "::error::No signing identity found in p12"; exit 1; }

          # Provisioning profile -> bundle id + entitlements
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          APPID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          BUNDLE_ID="${APPID#*.}"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          echo "Signing as bundle id: $BUNDLE_ID"

          # Unpack unsigned IPA
          WORK="$RUNNER_TEMP/resign"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q unsigned.ipa -d "$WORK"
          APP="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -n1)"

          # The profile covers one app id only, so drop extensions (e.g. PlayerWidget)
          rm -rf "$APP/PlugIns"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # Sign nested frameworks/dylibs first, then the app
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              codesign --force --sign "$IDENTITY" --timestamp=none "$f"
            done
          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

          mkdir -p out
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/out/Tango-ios-signed.ipa" Payload)

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tango-ios-signed
          path: out/Tango-ios-signed.ipa