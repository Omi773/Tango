name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Discord SDK (iOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download discord-sdk --pattern discord-ios.zip --dir /tmp
          mkdir -p third_party/tango_discord/ios/Frameworks
          unzip -q /tmp/discord-ios.zip -d third_party/tango_discord/ios/Frameworks
          test -d third_party/tango_discord/ios/Frameworks/discord_partner_sdk.xcframework
          test -f third_party/tango_discord/ios/Frameworks/Discord-License-Notices.txt

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Build Rust backend for iOS
        run: bash scripts/build_ios.sh

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Pods
          key: pods-rust-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'rust_backend/TangoBackend.podspec', 'rust_backend/Cargo.lock') }}
          restore-keys: pods-rust-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_audio*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/build/ios/ipa/Tango-ios-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tango-ios
          path: build/ios/ipa/*.ipa
